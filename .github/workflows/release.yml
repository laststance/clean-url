name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual publishing)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && format('release-verification-{0}', github.run_id) || 'release-chrome-store' }}
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build for Chrome
      run: pnpm build

    - name: Create Chrome ZIP
      run: pnpm zip

    - name: Verify ZIP output
      run: |
        echo "📦 Checking .output directory contents:"
        ls -la .output/
        echo "📦 ZIP files found:"
        find .output -name "*.zip" -type f

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: extension-packages
        path: .output/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 90

  publish-chrome:
    runs-on: ubuntu-latest
    needs: build-and-package
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download packages
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: extension-packages
        path: .output/

    - name: List downloaded artifacts
      run: |
        echo "📦 Downloaded artifacts:"
        ls -la .output/
        find .output -name "*.zip" -type f

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'

    - name: Verify or submit to Chrome Web Store API v2
      run: node scripts/submit-chrome.mjs --zip .output/clean-url-*-chrome.zip
      env:
        CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
        CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  publish-edge:
    runs-on: ubuntu-latest
    needs: build-and-package
    if: (github.event_name == 'push' || github.event.inputs.dry_run == 'false') && vars.ENABLE_EDGE_PUBLISH == 'true'
    timeout-minutes: 10
    continue-on-error: true  # Edge publish is optional

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download packages
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: extension-packages
        path: .output/

    - name: List downloaded artifacts
      run: |
        echo "📦 Downloaded artifacts:"
        ls -la .output/
        find .output -name "*.zip" -type f

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Submit to Edge Addons
      run: |
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          echo "Running in dry-run mode for Edge Addons"
          pnpm wxt submit --dry-run --edge-zip .output/clean-url-*-chrome.zip
        else
          echo "Publishing to Edge Addons"
          pnpm wxt submit --edge-zip .output/clean-url-*-chrome.zip
        fi
      env:
        EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        EDGE_CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET }}
        EDGE_ACCESS_TOKEN_URL: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}

  notify:
    runs-on: ubuntu-latest
    needs: [publish-chrome]
    if: always() && github.event_name == 'push'

    steps:
    - name: Notify success
      if: needs.publish-chrome.result == 'success'
      run: echo "✅ Chrome Web Store submission accepted; approval and public availability are separate."

    - name: Notify failure
      if: needs.publish-chrome.result == 'failure'
      run: echo "❌ Chrome Web Store publishing failed"
